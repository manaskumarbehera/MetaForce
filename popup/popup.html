<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MetaForce</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <header class="head">
        <span class="logo" aria-hidden="true">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </span>
        <span class="brand" data-i18n="popupTitle">MetaForce</span>
        <span id="statusDot" class="dot dot--off" aria-hidden="true"></span>
      </header>

      <p id="stateText" class="state" data-i18n="popupInactive">
        Open a Salesforce Lightning record page to use MetaForce.
      </p>
      <p class="hint" data-i18n="popupHint">
        Click the search icon at the edge of the record page to search fields or open All Data.
      </p>

      <section class="toggles" aria-label="Quick toggles">
        <label class="toggle-row">
          <span data-i18n="toggleAllData">Show "All Data" tab</span>
          <input id="enableAllData" type="checkbox" class="toggle" />
        </label>
        <label class="toggle-row">
          <span data-i18n="toggleInlineEdit">Allow inline editing</span>
          <input id="enableInlineEdit" type="checkbox" class="toggle" />
        </label>
      </section>

      <footer class="foot">
        <button id="openSettings" type="button" class="btn" data-i18n="openSettings">
          Settings
        </button>
      </footer>
    </main>

    <script src="../mf_shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
