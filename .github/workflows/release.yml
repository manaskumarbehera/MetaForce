name: Release (Chrome Web Store)

# Tagging `v*` builds + validates, then uploads to the store DRAFT (dry-run).
# Actual submission for review is a manual, opt-in action (workflow_dispatch with
# publish=true). Requires repository secrets:
#   CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
# If those secrets are absent, the release step is skipped (no failure).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit for review (otherwise upload to draft only)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Chrome Web Store release
        if: ${{ env.CHROME_EXTENSION_ID != '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            npm run release:chrome:publish
          else
            npm run release:chrome:dry
          fi
      - name: Skip (unconfigured)
        if: ${{ env.CHROME_EXTENSION_ID == '' }}
        run: echo "::notice::CHROME_EXTENSION_ID secret not set — skipping Chrome Web Store release."
